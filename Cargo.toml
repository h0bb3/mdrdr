[package]
name = "mdrdr"
version = "0.1.0"
edition = "2021"
description = "A fast, lightweight, from-scratch markdown viewer."
license = "MIT OR Apache-2.0"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = "thin"
codegen-units = 1
