name: release

# Every push to `release` builds binaries for Linux, macOS (universal —
# arm64 + x86_64 in one file) and Windows, then publishes them in a GitHub
# Release tagged with the short commit SHA. Merge/push to `release` → one
# click away from artefacts.

on:
  push:
    branches: [release]
  workflow_dispatch: {}

permissions:
  contents: write

# Opt in to Node 24 for JS-based actions (actions/checkout, cache,
# upload-artifact, download-artifact). Silences the Node 20 deprecation
# warning ahead of the June 2026 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-linux-windows:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: mdrdr
            asset: mdrdr-linux-x86_64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: mdrdr.exe
            asset: mdrdr-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: install linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Build both Apple architectures on the (plentiful) arm64 runner and fuse
  # them into a single universal Mach-O with `lipo`. Avoids the chronically
  # backed-up macos-13 x86_64 runner pool.
  build-macos-universal:
    name: build-macos-universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain (both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-universal-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-universal-cargo-

      - name: build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: lipo into universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/mdrdr \
            target/x86_64-apple-darwin/release/mdrdr \
            -output dist/mdrdr-macos-universal
          lipo -info dist/mdrdr-macos-universal

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdrdr-macos-universal
          path: dist/mdrdr-macos-universal
          if-no-files-found: error

  release:
    name: publish release
    needs: [build-linux-windows, build-macos-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: compute tag
        id: tag
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "tag=release-$SHA" >> "$GITHUB_OUTPUT"
          echo "name=mdrdr $SHA" >> "$GITHUB_OUTPUT"

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
